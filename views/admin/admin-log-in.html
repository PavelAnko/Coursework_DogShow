<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід Адміністратора</title>
    <link rel="icon" type="image/png" href="/img/logo.jpg">
    <link rel="stylesheet" href="/css/admin-log-in.css">
</head>
<body>
    <div class="login-container">
        <h1>Вхід адміністратора</h1>
        <form id="admin-login-form" action="/admin/user" method="POST">
            <label for="first_name">Ім'я:</label>
            <input type="text" id="first_name" name="first_name" maxlength="50" required>

            <label for="last_name">Прізвище:</label>
            <input type="text" id="last_name" name="last_name" maxlength="60" required>

            <label for="password1">Пароль 1:</label>
            <input type="password" id="password1" name="password1" required>

            <label for="password2">Пароль 2:</label>
            <input type="password" id="password2" name="password2" required>

            <button type="submit">Увійти</button>
        </form>
        <p id="error-message" style="color: red; margin-top: 10px; text-align: center;"></p>
    </div>
    <script src="/js/adminJs/admin-log-in.js"></script>
</body>
</html>
